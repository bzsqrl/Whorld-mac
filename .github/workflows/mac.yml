name: mac

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S mac -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The engine must stay portable; building on Linux catches stray Apple or
  # Windows headers.
  engine-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S mac -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  app:
    runs-on: macos-latest
    needs: engine-macos
    steps:
      - uses: actions/checkout@v5
      - name: Build app
        # The Xcode project arrives in Phase 3; skip until it exists.
        if: hashFiles('mac/app/Whorld.xcodeproj/project.pbxproj') != ''
        run: xcodebuild -project mac/app/Whorld.xcodeproj -scheme Whorld -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Package universal DMG
        run: sh mac/packaging/make_dmg.sh
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Whorld-dmg
          path: build/dist/*.dmg
